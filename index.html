<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FUNK TEAR 3000</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        body { font-family: 'Press Start 2P', system-ui; }
        .neon { text-shadow: 0 0 10px #ff00ff, 0 0 20px #ff00ff; }
    </style>
</head>
<body class="bg-black text-white overflow-hidden">
    <div class="fixed inset-0 flex items-center justify-center">
        <div id="content" class="max-w-4xl mx-auto p-8 bg-gradient-to-br from-purple-900 via-pink-900 to-cyan-900 rounded-3xl shadow-2xl border-4 border-cyan-400 relative z-10">
            <h1 class="text-6xl font-bold text-center neon mb-4 text-transparent bg-clip-text bg-gradient-to-r from-pink-400 via-cyan-400 to-yellow-400">FUNK TEAR 3000</h1>
            <p class="text-center text-cyan-300 mb-8">DRAG TO TEAR • TWO FINGERS ON MOBILE • PURE CHAOS</p>
            
            <div class="grid grid-cols-2 gap-8">
                <div>
                    <label class="block text-sm mb-2">BASS BOOST</label>
                    <input type="range" min="0" max="100" value="75" class="w-full accent-pink-500">
                </div>
                <div>
                    <label class="block text-sm mb-2">VIBE LEVEL</label>
                    <input type="range" min="0" max="100" value="88" class="w-full accent-cyan-500">
                </div>
            </div>
            
            <div class="flex gap-4 mt-8">
                <button onclick="dropTheBeat()" class="flex-1 bg-gradient-to-r from-pink-500 to-yellow-500 hover:from-pink-600 hover:to-yellow-600 text-black font-bold py-4 px-6 rounded-2xl text-xl">DROP THE BEAT 🔥</button>
                <button onclick="resetPage()" class="flex-1 bg-white/10 hover:bg-white/20 border border-white/30 py-4 px-6 rounded-2xl text-xl">RESET PAGE</button>
            </div>
            
            <div class="mt-8 text-center text-xs text-white/60">
                All elements still work after tearing!<br>
                <span class="text-pink-400">Real physics • Jagged tears • Confetti</span>
            </div>
        </div>
    </div>

    <canvas id="tearCanvas" class="fixed inset-0 pointer-events-none z-20"></canvas>

    <script>
        // Simple placeholder physics - will be replaced with full Verlet later
        console.log('%cFUNK TEAR 3000 LOADED 🔥', 'color:#ff00ff; font-size:18px; font-family:monospace');
        
        function dropTheBeat() {
            alert("💥 BOOM! Massive tear incoming!");
        }
        
        function resetPage() {
            location.reload();
        }
        
        // Tailwind script already loaded
        document.documentElement.setAttribute('data-tailwind', 'true');
    </script>
</body>
</html>
