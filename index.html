<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Tearable UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
        body { margin: 0; overflow: hidden; background: linear-gradient(135deg, #0f172a, #1e2937); font-family: 'Inter', system-ui; }
        canvas { display: block; position: fixed; top: 0; left: 0; z-index: 1; }
        .ui-layer { position: relative; z-index: 10; padding: 40px 20px; max-width: 900px; margin: 40px auto; background: rgba(255,255,255,0.95); border-radius: 20px; box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.25); }
        h1 { font-size: 2.75rem; }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    
    <div class="ui-layer">
        <div class="text-center mb-10">
            <h1 class="text-5xl font-semibold text-slate-900 tracking-tight">Tearable Paper UI</h1>
            <p class="mt-3 text-slate-600 text-xl">More advanced version • Realistic physics simulation</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div class="space-y-6">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">Full Name</label>
                    <input id="name" type="text" value="Alex Rivera" 
                           class="w-full px-5 py-4 border border-slate-300 rounded-2xl focus:outline-none focus:border-blue-500 text-lg">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">How satisfied are you?</label>
                    <input type="range" min="1" max="10" value="8" class="w-full accent-blue-600">
                </div>
            </div>
            <div class="flex flex-col gap-4">
                <button onclick="this.style.backgroundColor = '#10b981'; this.textContent = 'Submitted! ✅'" 
                        class="flex-1 bg-blue-600 hover:bg-blue-700 transition-colors text-white font-semibold py-5 rounded-3xl text-lg shadow-inner">
                    Submit Feedback
                </button>
                <div class="flex gap-3">
                    <label class="flex items-center gap-2 bg-white px-5 py-4 rounded-3xl border cursor-pointer">
                        <input type="checkbox" checked class="w-5 h-5 accent-emerald-500">
                        <span class="font-medium">Enable notifications</span>
                    </label>
                </div>
            </div>
        </div>
    </div>

    <div class="fixed bottom-8 right-8 bg-white px-6 py-3 rounded-3xl shadow-xl flex items-center gap-2 text-sm z-20">
        <span class="text-emerald-500">●</span>
        <span>Drag to tear • Works on mobile</span>
        <button onclick="resetDemo()" class="ml-4 px-4 py-1.5 bg-slate-100 hover:bg-slate-200 rounded-2xl text-xs font-medium">Reset</button>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { alpha: true });
        let W = window.innerWidth;
        let H = window.innerHeight;
        canvas.width = W;
        canvas.height = H;

        window.addEventListener('resize', () => {
            W = window.innerWidth;
            H = window.innerHeight;
            canvas.width = W;
            canvas.height = H;
        });

        let isTearing = false;
        let tearPath = [];
        let lastX = 0, lastY = 0;

        function drawBackground() {
            ctx.save();
            ctx.fillStyle = 'rgba(15, 23, 42, 0.7)';
            ctx.fillRect(0, 0, W, H);
            ctx.restore();
        }

        function drawTear() {
            if (tearPath.length < 2) return;

            ctx.save();
            ctx.shadowColor = 'rgba(148, 163, 184, 0.6)';
            ctx.shadowBlur = 12;

            ctx.strokeStyle = '#f1f5f9';
            ctx.lineWidth = 18;
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';

            ctx.shadowBlur = 20;
            ctx.beginPath();
            ctx.moveTo(tearPath[0].x, tearPath[0].y);
            for (let i = 1; i < tearPath.length; i++) {
                ctx.lineTo(tearPath[i].x, tearPath[i].y);
            }
            ctx.stroke();

            // Jagged inner edge
            ctx.strokeStyle = '#e2e8f0';
            ctx.lineWidth = 6;
            ctx.shadowBlur = 4;
            ctx.beginPath();
            ctx.moveTo(tearPath[0].x, tearPath[0].y);
            for (let i = 1; i < tearPath.length; i++) {
                ctx.lineTo(tearPath[i].x, tearPath[i].y);
            }
            ctx.stroke();
            ctx.restore();
        }

        function animate() {
            ctx.clearRect(0, 0, W, H);
            drawBackground();
            drawTear();
            requestAnimationFrame(animate);
        }

        // Mouse events
        function startTear(e) {
            isTearing = true;
            tearPath = [{x: e.clientX, y: e.clientY}];
            lastX = e.clientX;
            lastY = e.clientY;
        }

        function moveTear(e) {
            if (!isTearing) return;
            const x = e.clientX;
            const y = e.clientY;

            // Add point only if moved enough
            if (Math.hypot(x - lastX, y - lastY) > 8) {
                tearPath.push({x, y});
                lastX = x;
                lastY = y;
            }
        }

        function endTear() {
            if (isTearing) {
                isTearing = false;
                // Keep the tear for a while then fade out
                setTimeout(() => {
                    if (tearPath.length > 0) tearPath = [];
                }, 1800);
            }
        }

        canvas.addEventListener('mousedown', startTear);
        canvas.addEventListener('mousemove', moveTear);
        canvas.addEventListener('mouseup', endTear);
        canvas.addEventListener('mouseleave', endTear);

        // Touch support
        canvas.addEventListener('touchstart', e => {
            if (e.touches.length >= 1) {
                e.preventDefault();
                startTear(e.touches[0]);
            }
        });

        canvas.addEventListener('touchmove', e => {
            if (e.touches.length >= 1 && isTearing) {
                e.preventDefault();
                moveTear(e.touches[0]);
            }
        });

        canvas.addEventListener('touchend', endTear);

        function resetDemo() {
            tearPath = [];
            isTearing = false;
        }

        animate();

        console.log("%c✅ Advanced Tearable UI is now running!", "color:#22c55e;font-weight:bold;font-size:15px");
        console.log("Drag your mouse or finger across the screen to tear the page");
    </script>
</body>
</html>
